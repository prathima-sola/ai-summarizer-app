services:
  - type: web
    name: ai-summarizer-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RUN_DOCUMENT_WORKER
        value: true
      - key: WORKER_POLL_INTERVAL_MS
        value: 2000
      - key: NODE_VERSION
        value: 24
